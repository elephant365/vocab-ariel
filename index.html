<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語單字隨身聽 & 複習</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-bottom: 80px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; color: var(--primary); }
    select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    .btn-secondary { background: #10b981; }
    .btn-warning { background: #f59e0b; }
    .card {
      background: var(--card-bg);
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .word-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    .kk { color: #6b7280; font-size: 0.9rem; }
    .example { font-size: 0.95rem; margin-top: 5px; color: #374151; }
    .section { display: none; }
    .active { display: block; }
    
    /* 閃卡樣式 */
    .flashcard {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 1.4rem;
    }
    .score-btns { display: flex; gap: 5px; margin-top: 10px; }
    .score-btns button { flex: 1; font-size: 0.85rem; padding: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 單字隨身背</h1>

  <label for="lessonSelect"><b>選擇課堂：</b></label>
  <select id="lessonSelect" onchange="loadLesson()">
    <option value="L1">Lesson 1: 校園與社交</option>
    <option value="L2">Lesson 2: 週末休閒活動</option>
  </select>

  <div style="display: flex; gap: 5px;">
    <button onclick="showSection('listSec')">📋 列表</button>
    <button class="btn-secondary" onclick="startAudioMode()">🎧 通勤聽</button>
    <button class="btn-warning" onclick="startFlashcards()">🎴 閃卡</button>
    <button style="background: #ef4444;" onclick="startQuiz()">📝 測驗</button>
  </div>

  <hr style="border:0; border-top:1px solid #ccc; margin: 15px 0;">

  <div id="listSec" class="section active">
    <h3>單字列表</h3>
    <div id="wordList"></div>
  </div>

  <div id="audioSec" class="section">
    <h3>🎧 通勤播放模式</h3>
    <div class="card" style="text-align: center;">
      <p id="audioStatus">準備播放...</p>
      <div id="audioCurrentWord" style="font-size: 1.5rem; font-weight: bold;">-</div>
      <div id="audioCurrentSentence" style="color: #6b7280; margin-top: 10px;">-</div>
      <button onclick="stopAudio()">⏹️ 停止播放</button>
    </div>
  </div>

  <div id="cardSec" class="section">
    <h3>🎴 閃卡複習 (正向：看英猜中)</h3>
    <div class="card flashcard" id="flashcardBox" onclick="flipCard()">
      點擊開始
    </div>
    <div id="cardControls" style="display:none;">
      <p style="text-align: center; font-size: 0.9rem; color: #6b7280;">記憶熟悉度評分：</p>
      <div class="score-btns">
        <button style="background:#ef4444;" onclick="nextCard(1)">🔴 不熟</button>
        <button style="background:#f59e0b;" onclick="nextCard(2)">🟡 模糊</button>
        <button style="background:#10b981;" onclick="nextCard(3)">🟢 熟悉</button>
      </div>
    </div>
  </div>

  <div id="quizSec" class="section">
    <h3>📝 例句克漏字測驗</h3>
    <div class="card">
      <p id="quizSentence" style="font-size: 1.1rem;"></p>
      <p id="quizMeaning" style="color: #6b7280;"></p>
      <input type="text" id="quizInput" placeholder="請輸入缺少的英文單字" style="width:90%; padding:10px; margin-bottom:10px;">
      <button onclick="checkQuiz()">送出答案</button>
      <p id="quizResult" style="font-weight: bold; margin-top: 10px;"></p>
    </div>
  </div>
</div>

<script>
// 假資料庫 (預設由電腦端 AI 生成後帶入)
const lessonsData = {
  "L1": [
    { word: "definitely", pos: "adv.", kk: "/ˈdef.ən.ət.li/", zh: "一定；肯定", exEn: "I will definitely go to the movie with you this Saturday.", exZh: "我這週六一定會跟你去看電影。" },
    { word: "popular", pos: "adj.", kk: "/ˈpɑː.pjə.lɚ/", zh: "受歡迎的", exEn: "He is a very popular student in our school.", exZh: "他是我們學校非常受歡迎的學生。" }
  ],
  "L2": [
    { word: "activity", pos: "n.", kk: "/ækˈtɪv.ə.t̬i/", zh: "活動", exEn: "Playing basketball is my favorite weekend activity.", exZh: "打籃球是我最喜歡的週末活動。" }
  ]
};

let currentLesson = [];
let synth = window.speechSynthesis;

function loadLesson() {
  const lessonKey = document.getElementById("lessonSelect").value;
  currentLesson = lessonsData[lessonKey];
  renderWordList();
}

// 語音發音工具
function speak(text, lang = 'en-US', callback) {
  if (synth.speaking) synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 0.9; // 稍微放慢語速適合學生
  if (callback) utter.onend = callback;
  synth.speak(utter);
}

// 1. 渲染單字列表
function renderWordList() {
  const container = document.getElementById("wordList");
  container.innerHTML = "";
  currentLesson.forEach((w) => {
    container.innerHTML += `
      <div class="card">
        <div class="word-title">${w.word} <span style="font-size:0.9rem; color:#4f46e5;">[${w.pos}]</span> 
          <button style="width:auto; padding:3px 8px;" onclick="speak('${w.word}')">🔊</button>
        </div>
        <div class="kk">${w.kk} | ${w.zh}</div>
        <div class="example"><b>例句：</b>${w.exEn} <button style="width:auto; padding:2px 6px;" onclick="speak('${w.exEn}')">🔊</button></div>
        <div class="example" style="color:#6b7280;">${w.exZh}</div>
      </div>
    `;
  });
}

function showSection(id) {
  stopAudio();
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 2. 通勤語音循環播放模式
let isPlayingAudio = false;
let audioIndex = 0;

function startAudioMode() {
  showSection('audioSec');
  isPlayingAudio = true;
  audioIndex = 0;
  playNextAudioStep();
}

function playNextAudioStep() {
  if (!isPlayingAudio) return;
  if (audioIndex >= currentLesson.length) audioIndex = 0; // 循環播放

  const item = currentLesson[audioIndex];
  document.getElementById("audioStatus").innerText = `正在播放 (${audioIndex + 1}/${currentLesson.length})`;
  document.getElementById("audioCurrentWord").innerText = `${item.word} ${item.zh}`;
  document.getElementById("audioCurrentSentence").innerText = item.exEn;

  // 播放流程：英文單字 -> (停1.5秒) -> 中文翻譯 -> 英文例句 -> (停2秒) -> 下一題
  speak(item.word, 'en-US', () => {
    setTimeout(() => {
      if (!isPlayingAudio) return;
      speak(item.zh, 'zh-TW', () => {
        setTimeout(() => {
          if (!isPlayingAudio) return;
          speak(item.exEn, 'en-US', () => {
            setTimeout(() => {
              if (!isPlayingAudio) return;
              audioIndex++;
              playNextAudioStep();
            }, 2000); // 例句結束後停頓 2 秒
          });
        }, 1000);
      });
    }, 1500); // 單字唸完停頓 1.5 秒讓大腦思考
  });
}

function stopAudio() {
  isPlayingAudio = false;
  synth.cancel();
}

// 3. 閃卡模式
let cardIndex = 0;
let isFlipped = false;

function startFlashcards() {
  showSection('cardSec');
  cardIndex = 0;
  showCard();
}

function showCard() {
  isFlipped = false;
  document.getElementById("cardControls").style.display = "none";
  const item = currentLesson[cardIndex];
  document.getElementById("flashcardBox").innerHTML = `<div>${item.word}</div><div class="kk">${item.kk}</div><div style="font-size:0.8rem; color:#aaa; margin-top:15px;">(點擊翻牌)</div>`;
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  const item = currentLesson[cardIndex];
  document.getElementById("flashcardBox").innerHTML = `
    <div style="color:var(--primary); font-weight:bold;">${item.word}</div>
    <div style="margin:10px 0;">${item.zh}</div>
    <div style="font-size:0.9rem; color:#4f46e5;">${item.exEn}</div>
  `;
  speak(item.word);
  document.getElementById("cardControls").style.display = "block";
}

function nextCard(score) {
  cardIndex = (cardIndex + 1) % currentLesson.length;
  showCard();
}

// 4. 克漏字測驗
let quizIndex = 0;

function startQuiz() {
  showSection('quizSec');
  quizIndex = 0;
  loadQuizQuestion();
}

function loadQuizQuestion() {
  const item = currentLesson[quizIndex];
  // 建立填空例句 (將單字替換為 _______)
  const regex = new RegExp(item.word, "gi");
  const blankSentence = item.exEn.replace(regex, "________");
  
  document.getElementById("quizSentence").innerText = blankSentence;
  document.getElementById("quizMeaning").innerText = `翻譯：${item.exZh}`;
  document.getElementById("quizInput").value = "";
  document.getElementById("quizResult").innerText = "";
}

function checkQuiz() {
  const item = currentLesson[quizIndex];
  const userAns = document.getElementById("quizInput").value.trim().toLowerCase();
  const resultElem = document.getElementById("quizResult");
  
  if (userAns === item.word.toLowerCase()) {
    resultElem.style.color = "#10b981";
    resultElem.innerText = "🎉 正確！太棒了！";
    speak(item.word);
    setTimeout(() => {
      quizIndex = (quizIndex + 1) % currentLesson.length;
      loadQuizQuestion();
    }, 1500);
  } else {
    resultElem.style.color = "#ef4444";
    resultElem.innerText = `❌ 答案不對喔，正確答案是：${item.word}`;
  }
}

// 初始化
loadLesson();
</script>
</body>
</html>
