<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語單字隨身聽 & 複習</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --navy: #1e3a8a;
      --gray-text: #6b7280;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-bottom: 80px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; color: var(--primary); }
    select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    .btn-secondary { background: #10b981; }
    .btn-warning { background: #f59e0b; }
    .card {
      background: var(--card-bg);
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .word-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    .kk { color: var(--gray-text); font-size: 0.9rem; }
    .example-en { font-size: 0.95rem; margin-top: 5px; color: var(--navy); font-weight: 500; }
    .example-zh { font-size: 0.85rem; margin-top: 2px; color: var(--gray-text); font-weight: normal; }
    .section { display: none; }
    .active { display: block; }
    
    .flashcard {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }
    .audio-icon-btn {
      width: auto !important;
      display: inline-block;
      padding: 2px 8px !important;
      margin: 0 0 0 5px !important;
      font-size: 0.85rem;
      border-radius: 6px;
      background: #e0e7ff;
      color: var(--primary);
    }
    .loading-overlay {
      text-align: center;
      padding: 20px;
      color: var(--gray-text);
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 單字隨身背</h1>

  <div id="loadingStatus" class="loading-overlay">⏳ 正在從 Google Sheet 載入單字...</div>

  <div id="mainContent" style="display:none;">
    <label for="lessonSelect"><b>選擇課堂：</b></label>
    <select id="lessonSelect" onchange="loadLesson()">
      <!-- 動態載入課堂選項 -->
    </select>

    <div style="display: flex; gap: 5px;">
      <button onclick="showSection('listSec')">📋 列表</button>
      <button class="btn-secondary" onclick="startAudioMode()">🎧 通勤聽</button>
      <button class="btn-warning" onclick="startFlashcards()">🎴 閃卡</button>
      <button style="background: #ef4444;" onclick="startQuiz()">📝 測驗</button>
    </div>

    <hr style="border:0; border-top:1px solid #ccc; margin: 15px 0;">

    <!-- Phase 1: 列表 -->
    <div id="listSec" class="section active">
      <h3>單字列表</h3>
      <div id="wordList"></div>
    </div>

    <!-- Phase 2: 通勤播放 -->
    <div id="audioSec" class="section">
      <h3>🎧 通勤播放模式</h3>
      <div class="card" style="text-align: center;">
        <p id="audioStatus" style="color: var(--gray-text); font-size: 0.9rem;">準備播放...</p>
        <div id="audioCurrentWord" style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">-</div>
        <div id="audioCurrentZh" style="font-size: 1.1rem; margin-top: 5px;">-</div>
        <div id="audioCurrentSentenceEn" class="example-en" style="margin-top: 15px;">-</div>
        <div id="audioCurrentSentenceZh" class="example-zh" style="margin-bottom: 15px;">-</div>
        <button onclick="stopAudio()" style="background: #ef4444;">⏹️ 停止播放</button>
      </div>
    </div>

    <!-- Phase 3: 閃卡 -->
    <div id="cardSec" class="section">
      <h3>🎴 閃卡複習</h3>
      <div class="card flashcard" id="flashcardBox" onclick="flipCard()">
        點擊開始
      </div>
      <div id="cardControls" style="display:none; margin-top: 10px;">
        <button onclick="nextCard()">下一題 ➔</button>
      </div>
    </div>

    <!-- Phase 4: 測驗 -->
    <div id="quizSec" class="section">
      <h3>📝 例句克漏字測驗</h3>
      <div class="card">
        <p id="quizSentence" style="font-size: 1.1rem; font-weight: bold; color: var(--navy);"></p>
        <p id="quizMeaning" class="example-zh" style="font-size: 0.95rem; margin-bottom: 10px;"></p>
        <input type="text" id="quizInput" placeholder="請輸入缺少的英文單字" style="width:100%; box-sizing: border-box; padding:10px; margin-bottom:10px;">
        <button onclick="checkQuiz()">送出答案</button>
        <p id="quizResult" style="font-weight: bold; margin-top: 10px;"></p>
      </div>
    </div>
  </div>
</div>

<script>
// 設定你的 Google Sheet ID
const SHEET_ID = '1QSGkj3JpQ4klVAMBSTfffBaF1C4cO48sQI0ZLIBy898';
// 使用 Google Visualization API 自動抓取表單資料
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

let lessonsData = {};
let currentLesson = [];
let synth = window.speechSynthesis;
let audioTimeout = null;

// 從 Google Sheet 抓取資料並解析
async function fetchGoogleSheetData() {
  try {
    const response = await fetch(SHEET_URL);
    const text = await response.text();
    // 移除 Google 返回的 JSONP 包裝字串
    const jsonString = text.substring(47, text.length - 2);
    const data = JSON.parse(jsonString);
    
    const rows = data.table.rows;
    lessonsData = {};

    rows.forEach(row => {
      const c = row.c;
      if (!c || !c[0] || !c[0].v) return; // 略過空白列

      // 八欄順序：單字[0], 例句[1], KK音標[2], 詞性[3], 單字中文[4], 例句中文[5], 日期[6], Unit[7]
      const word = c[0] ? String(c[0].v).trim() : "";
      const exEn = c[1] ? String(c[1].v).trim() : "";
      const kk = c[2] ? String(c[2].v).trim() : "";
      const pos = c[3] ? String(c[3].v).trim() : "";
      const zh = c[4] ? String(c[4].v).trim() : "";
      const exZh = c[5] ? String(c[5].v).trim() : "";
      const unit = c[7] ? String(c[7].v).trim() : "未分類";

      // 如果標頭列存在，跳過
      if (word === "單字" || word === "Word") return;

      if (!lessonsData[unit]) {
        lessonsData[unit] = [];
      }

      lessonsData[unit].push({ word, pos, kk, zh, exEn, exZh });
    });

    populateLessonSelect();
    document.getElementById("loadingStatus").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    loadLesson();
  } catch (error) {
    console.error("載入 Google Sheet 失敗:", error);
    document.getElementById("loadingStatus").innerText = "❌ 資料載入失敗，請確認 Google Sheet 共用與發布設定。";
  }
}

// 動態生成課堂下拉選單
function populateLessonSelect() {
  const select = document.getElementById("lessonSelect");
  select.innerHTML = "";
  const units = Object.keys(lessonsData);
  
  units.forEach(unit => {
    const option = document.createElement("option");
    option.value = unit;
    option.innerText = unit;
    select.appendChild(option);
  });
}

function loadLesson() {
  const lessonKey = document.getElementById("lessonSelect").value;
  currentLesson = lessonsData[lessonKey] || [];
  renderWordList();
}

// 發音工具
function speak(text, lang = 'en-US', callback) {
  if (synth.speaking) synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 0.9;
  if (callback) utter.onend = callback;
  synth.speak(utter);
}

function stopAudio() {
  isPlayingAudio = false;
  if (audioTimeout) clearTimeout(audioTimeout);
  if (synth) synth.cancel();
}

// 1. 列表模式
function renderWordList() {
  const container = document.getElementById("wordList");
  container.innerHTML = "";
  currentLesson.forEach((w) => {
    container.innerHTML += `
      <div class="card">
        <div class="word-title">${w.word} <span style="font-size:0.85rem; color:var(--primary); font-weight:normal;">[${w.pos}]</span> 
          <button class="audio-icon-btn" onclick="speak('${w.word}')">🔊</button>
        </div>
        <div class="kk">${w.kk} | ${w.zh}</div>
        <div class="example-en">例句：${w.exEn} <button class="audio-icon-btn" onclick="speak('${w.exEn.replace(/'/g, "\\'")}')">🔊</button></div>
        <div class="example-zh">${w.exZh}</div>
      </div>
    `;
  });
}

function showSection(id) {
  stopAudio();
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 2. 通勤播放模式
let isPlayingAudio = false;
let audioIndex = 0;

function startAudioMode() {
  showSection('audioSec');
  isPlayingAudio = true;
  audioIndex = 0;
  playNextAudioStep();
}

function playNextAudioStep() {
  if (!isPlayingAudio) return;
  if (audioIndex >= currentLesson.length) audioIndex = 0;

  const item = currentLesson[audioIndex];
  document.getElementById("audioStatus").innerText = `正在播放 (${audioIndex + 1}/${currentLesson.length})`;
  document.getElementById("audioCurrentWord").innerText = `${item.word} [${item.pos}]`;
  document.getElementById("audioCurrentZh").innerText = item.zh;
  document.getElementById("audioCurrentSentenceEn").innerText = item.exEn;
  document.getElementById("audioCurrentSentenceZh").innerText = item.exZh;

  speak(item.word, 'en-US', () => {
    audioTimeout = setTimeout(() => {
      if (!isPlayingAudio) return;
      speak(item.zh, 'zh-TW', () => {
        if (!isPlayingAudio) return;
        speak(item.exEn, 'en-US', () => {
          if (!isPlayingAudio) return;
          speak(item.exZh, 'zh-TW', () => {
            if (!isPlayingAudio) return;
            audioTimeout = setTimeout(() => {
              if (!isPlayingAudio) return;
              audioIndex++;
              playNextAudioStep();
            }, 2000);
          });
        });
      });
    }, 1500);
  });
}

// 3. 閃卡模式
let cardIndex = 0;
let isFlipped = false;

function startFlashcards() {
  showSection('cardSec');
  cardIndex = 0;
  showCard();
}

function showCard() {
  stopAudio();
  isFlipped = false;
  document.getElementById("cardControls").style.display = "none";
  const item = currentLesson[cardIndex];
  
  document.getElementById("flashcardBox").innerHTML = `
    <div class="word-title" style="font-size: 1.5rem;">${item.word} 
      <button class="audio-icon-btn" onclick="event.stopPropagation(); speak('${item.word}')">🔊</button>
    </div>
    <div class="kk" style="margin: 5px 0;">${item.kk}</div>
    <div style="font-size:0.95rem; color:var(--primary); margin-bottom: 10px;">[${item.pos}]</div>
    <div class="example-en">
      ${item.exEn} 
      <button class="audio-icon-btn" onclick="event.stopPropagation(); speak('${item.exEn.replace(/'/g, "\\'")}')">🔊</button>
    </div>
    <div style="font-size:0.8rem; color:#aaa; margin-top:15px;">(點擊卡片顯示解答)</div>
  `;
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  const item = currentLesson[cardIndex];
  
  document.getElementById("flashcardBox").innerHTML = `
    <div class="word-title" style="font-size: 1.5rem;">${item.word}</div>
    <div style="font-size: 1.1rem; font-weight: bold; margin: 8px 0; color:#10b981;">${item.zh}</div>
    <div class="example-en">${item.exEn}</div>
    <div class="example-zh">${item.exZh}</div>
  `;
  
  document.getElementById("cardControls").style.display = "block";

  speak(item.word, 'en-US', () => {
    speak(item.word, 'en-US', () => {
      audioTimeout = setTimeout(() => {
        speak(item.zh, 'zh-TW', () => {
          speak(item.exEn, 'en-US');
        });
      }, 500);
    });
  });
}

function nextCard() {
  cardIndex = (cardIndex + 1) % currentLesson.length;
  showCard();
}

// 4. 克漏字測驗
let quizIndex = 0;

function startQuiz() {
  showSection('quizSec');
  quizIndex = 0;
  loadQuizQuestion();
}

function loadQuizQuestion() {
  stopAudio();
  const item = currentLesson[quizIndex];
  const regex = new RegExp(item.word, "gi");
  const blankSentence = item.exEn.replace(regex, "________");
  
  document.getElementById("quizSentence").innerText = blankSentence;
  document.getElementById("quizMeaning").innerText = `翻譯：${item.exZh}`;
  document.getElementById("quizInput").value = "";
  document.getElementById("quizResult").innerText = "";
}

function checkQuiz() {
  const item = currentLesson[quizIndex];
  const userAns = document.getElementById("quizInput").value.trim().toLowerCase();
  const resultElem = document.getElementById("quizResult");
  
  if (userAns === item.word.toLowerCase()) {
    resultElem.style.color = "#10b981";
    resultElem.innerText = "🎉 正確！太棒了！";
    speak(item.word);
    setTimeout(() => {
      quizIndex = (quizIndex + 1) % currentLesson.length;
      loadQuizQuestion();
    }, 1500);
  } else {
    resultElem.style.color = "#ef4444";
    resultElem.innerText = `❌ 答案不對喔，正確答案是：${item.word}`;
  }
}

// 啟動抓取資料
fetchGoogleSheetData();
</script>
</body>
</html>
